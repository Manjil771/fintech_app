flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/appstore.png"
  web:
    generate: true
    image_path: "assets/images/appstore.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/appstore.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/appstore.png"
