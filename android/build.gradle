buildscript {
    ext.kotlin_version = '1.9.24'
    ext.buildToolsVersion = "33.0.0"
    ext.compileSdkVersion = 34
    ext.minSdkVersion = 23
    ext.targetSdkVersion = 34
    repositories {
        google()
        mavenCentral()
        flatDir {dirs 'libs' }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.8.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
            // Optionally specify toolchain
            useIR = true // Enable Kotlin IR backend if needed
            freeCompilerArgs += ["-Xjvm-default=all"] // Optional for compatibility
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
