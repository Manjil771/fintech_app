name: Test Google Play Credentials

on:
  workflow_dispatch: # Allows manual triggering

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  test-credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Google Play Access
        run: |
          echo "Testing Google Play API access..."
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}' > service_account.json

          python3 -c "
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          try:
              creds = service_account.Credentials.from_service_account_file('service_account.json')
              service = build('androidpublisher', 'v3', credentials=creds)
              
              # Test API access by creating an edit
              edit = service.edits().insert(packageName='com.devanasoft.ismart').execute()
              print('✅ Success! Edit ID:', edit['id'])
              
              # Clean up by deleting the test edit
              service.edits().delete(
                  packageName='com.devanasoft.ismart',
                  editId=edit['id']
              ).execute()
              
          except HttpError as e:
              print('❌ API Error:', e.reason)
              print('Full error details:', e.content.decode())
              exit(1)
          except Exception as e:
              print('❌ Unexpected error:', str(e))
              exit(1)
          "
          rm service_account.json

